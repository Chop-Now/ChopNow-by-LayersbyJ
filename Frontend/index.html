<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChopNow - Rescue Delicious Food at Great Prices</title>
    <meta
      name="description"
      content="ChopNow connects you with local restaurants and stores to rescue surplus food at discounted prices. Save money, reduce waste, and enjoy delicious meals near you."
    />
    <meta name="theme-color" content="#0F3D2E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Poppins:wght@600;700;800&display=swap"
    />

    <!-- Favicon. The mark is a single colour, so neither variant reads on both
         tab-bar themes: green disappears on dark, yellow washes out on light.
         Browsers pick by theme; ones that ignore `media` fall back to green. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/logomarkyellow.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/logomarkgreen.svg" />
    <!-- iOS ignores SVG here and renders transparency as black, so this one is
         a flattened 180x180 PNG tile. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chopnow.app/" />
    <meta property="og:title" content="ChopNow - Rescue Delicious Food at Great Prices" />
    <meta
      property="og:description"
      content="Save money and reduce food waste. ChopNow connects you with local businesses offering surplus food at amazing discounts."
    />
    <!-- Most social platforms (Facebook, WhatsApp, LinkedIn, iMessage, Slack)
         don't render SVG for a link-preview image at all - this used to point
         at ChopNowLogo.svg, which meant every shared link showed a broken or
         blank preview image. Using the one real PNG asset in the repo as an
         honest stopgap; a proper 1200x630 branded social-share image would
         look much better here and is worth a follow-up. -->
    <meta property="og:image" content="https://chopnow.app/apple-touch-icon.png" />
    <meta property="og:site_name" content="ChopNow" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://chopnow.app/" />
    <meta name="twitter:title" content="ChopNow - Rescue Delicious Food at Great Prices" />
    <meta
      name="twitter:description"
      content="Save money and reduce food waste. ChopNow connects you with local businesses offering surplus food at amazing discounts."
    />
    <meta name="twitter:image" content="https://chopnow.app/apple-touch-icon.png" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://chopnow.app/" />

    <!-- Structured data: tells Google unambiguously what this site is and
         how its main sections relate, which is an input into (not a
         guarantee of) things like sitelinks in search results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ChopNow",
        "url": "https://chopnow.app/",
        "logo": "https://chopnow.app/apple-touch-icon.png",
        "email": "chopnow.app@gmail.com",
        "description": "ChopNow connects you with local restaurants and stores to rescue surplus food at discounted prices."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ChopNow",
        "url": "https://chopnow.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
