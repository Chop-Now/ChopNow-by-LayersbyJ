name: chopnow
description: ChopNow — Rescue food, save money, sustain tomorrow.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # HTTP & networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.4.0

  # Secure storage (JWT tokens)
  flutter_secure_storage: ^9.2.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Firebase (push notifications)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Real-time (Socket.io)
  socket_io_client: ^2.0.3+1

  # Maps & Location
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # Camera & image
  camera: ^0.11.0+2
  image_picker: ^1.1.2

  # Image display
  cached_network_image: ^3.3.1

  # Local notifications
  flutter_local_notifications: ^17.2.2

  # Charts
  fl_chart: ^0.69.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Animations
  lottie: ^3.1.2
  shimmer: ^3.0.0
  animate_do: ^3.3.4

  # UI utilities
  smooth_page_indicator: ^1.2.0
  flutter_svg: ^2.0.10
  gap: ^3.0.1
  intl: ^0.19.0

  # Sharing
  share_plus: ^10.0.0
  url_launcher: ^6.3.0

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  logger: ^2.4.0
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  local_auth: ^3.0.1
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  connectivity_plus: ^7.1.1
  flutter_native_splash: ^2.4.1
  firebase_crashlytics: ^4.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Test-only: lets tests fake Firebase.app() via the public
  # `Firebase.delegatePackingProperty` seam (see test/helpers/fake_firebase.dart)
  # instead of hitting a real platform channel. Already resolved transitively
  # through firebase_core; declared directly so the version is pinned and
  # `flutter analyze` doesn't flag it as an undeclared import.
  firebase_core_platform_interface: ^6.0.2
  # Test-only: lets tests fake GeolocatorPlatform.instance for
  # active_delivery_screen_test.dart's M28 tracking-failure banner (see
  # test/helpers/fake_geolocator.dart). Also already resolved transitively.
  geolocator_platform_interface: ^4.2.6
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
