name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC
  workflow_dispatch: {} # allow manually triggering a backup from the Actions tab

jobs:
  backup:
    name: Backup production MongoDB offsite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      MONGO_URI: ${{ secrets.PROD_MONGO_URI }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install MongoDB Database Tools (mongodump)
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo apt-get install -y ./mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb

      - name: Run backup
        run: node scripts/backup.js
